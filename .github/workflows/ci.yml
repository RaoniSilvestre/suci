name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99" # keep in sync with rust-version in Cargo.toml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: llvm-tools-preview

      - run: cargo +1.99 test --workspace
      - run: cargo +stable test --workspace

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo +stable llvm-cov --workspace --summary-only --fail-under-lines 70

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: clippy

      - run: cargo +stable fmt --all --check
      - run: cargo +nightly clippy --workspace --all-targets -- --deny warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo +stable doc --workspace --no-deps
