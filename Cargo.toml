[package]
name = "ruci"
version = "3.0.0-alpha"
description = "A UCI (Universal Chess Interface) crate."
categories = ["parser-implementations", "game-development"]
keywords = ["chess", "uci", "parser"]
include = ["src", "README.md", "LICENSE"]
edition = "2024"
authors = ["Leonard D."]
license = "GPL-3.0"
repository = "https://github.com/tigerros/ruci"
rust-version = "1.85.1"

[package.metadata.docs.rs]
all-features = true

[workspace]
members = [
    "examples/go-std",
]

[workspace.dependencies]
anyhow = { version = "1.0.87", default-features = false }
paste = { version = "1", default-features = false }
ruci = { version = "3.0.0-alpha", path = "." }
serde = { version = "1.0.197", default-features = false }
shakmaty = { version = "0.29.0", default-features = false }

[features]
# Enables serde support for most types. All implementations are derived with no parameters.
serde = ["dep:serde", "serde/alloc", "shakmaty/serde", "shakmaty/alloc"]

[dependencies]
paste = { workspace = true }
serde = { workspace = true, optional = true, features = ["derive"] }
shakmaty = { workspace = true }

[dev-dependencies]
pretty_assertions = { version = "1.4.1", features = ["unstable"] }

[lints.rust]
missing_debug_implementations = "warn"
missing_copy_implementations = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
must_use_candidate = "allow"
arithmetic_side_effects = "warn"
unchecked_time_subtraction = "warn"
as_conversions = "warn"
large_futures = "warn"
large_stack_arrays = "warn"
large_stack_frames = "warn"
modulo_one = "warn"
iterator_step_by_zero = "warn"
invalid_regex = "warn"
print_stdout = "warn"
print_stderr = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
exit = "deny"
todo = "deny"
unreachable = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
string_slice = "deny"
