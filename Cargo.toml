[package]
name = "suci"
version = "0.1.0"
description = "SUCI: a simple Rust UCI crate."
categories = ["parser-implementations", "game-development"]
keywords = ["chess", "uci", "parser"]
include = ["src", "README.md", "LICENSE", "NOTICE"]
edition = "2024"
authors = ["Leonard D.", "Raoni Silvestre"]
license = "GPL-3.0-only"
repository = "https://github.com/RaoniSilvestre/suci"
rust-version = "1.99"

[package.metadata.docs.rs]
all-features = true

[workspace]
members = [
    "examples/go-std",
]

[workspace.dependencies]
serde = { version = "1.0.197", default-features = false }
shakmaty = { version = "0.30.3", default-features = false }
suci = { version = "0.1.0", path = "." }

[features]
# Enables serde support for most types. All implementations are derived with no parameters.
serde = ["dep:serde", "serde/alloc", "shakmaty/serde", "shakmaty/alloc"]

[dependencies]
serde = { workspace = true, optional = true, features = ["derive"] }
shakmaty = { workspace = true }

[dev-dependencies]
pretty_assertions = { version = "1.4.1", features = ["unstable"] }

[lints.rust]
missing_debug_implementations = "warn"
missing_copy_implementations = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
must_use_candidate = "allow"
arithmetic_side_effects = "warn"
as_conversions = "warn"
large_stack_arrays = "warn"
large_stack_frames = "warn"
modulo_one = "warn"
iterator_step_by_zero = "warn"
invalid_regex = "warn"
print_stdout = "warn"
print_stderr = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
exit = "deny"
todo = "deny"
unreachable = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
string_slice = "deny"
